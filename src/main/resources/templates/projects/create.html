<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project | SkillForge</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<header class="app-header">
    <div class="container">
        <nav class="site-nav">

            <a class="brand" th:href="@{/dashboard}">
                <span class="brand-mark">S</span>
                <span>SkillForge</span>
            </a>

            <div class="nav-links">
                <a th:href="@{/dashboard}">Home</a>
                <a th:href="@{/projects}">Projects</a>
                <a th:href="@{/portfolio}">Portfolio</a>
            </div>

        </nav>
    </div>
</header>

<main class="page-main">

    <div class="container">

        <div class="dashboard-header">
            <div>
                <p class="field-hint">Projects</p>
                <h1>Create a Project</h1>
                <p class="field-hint">
                    Enter the details for your new SkillForge project.
                </p>
            </div>
        </div>

        <!-- Server-side error -->
        <div class="message-stack"
             th:if="${errorMessage}">

            <div class="alert alert-error">
                <span class="alert-icon">!</span>
                <span th:text="${errorMessage}">
                    An error occurred.
                </span>
            </div>

        </div>

        <section class="project-card">

            <form class="form-stack"
                  th:action="@{/projects}"
                  method="post">

                <!-- Project name -->
                <div class="form-field">

                    <label for="name">
                        Project name
                    </label>

                    <input id="name"
                           type="text"
                           name="name"
                           maxlength="150"
                           required>

                </div>

                <!-- Description -->
                <div class="form-field">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description"
                              name="description"
                              maxlength="5000"
                              rows="5"
                              placeholder="Describe your project and its goals"></textarea>

                </div>

                <!-- Required skills -->
                <div class="form-field">

                    <label for="requiredSkillsText">
                        Required skills
                    </label>

                    <textarea id="requiredSkillsText"
                              name="requiredSkillsText"
                              maxlength="2000"
                              rows="4"
                              placeholder="For example: Java, SQL, HTML, CSS"></textarea>

                </div>

                <!-- Maximum team size -->
                <div class="form-field">

                    <label for="maxTeamSize">
                        Maximum team size
                    </label>

                    <input id="maxTeamSize"
                           type="number"
                           name="maxTeamSize"
                           min="1"
                           step="1"
                           required>

                    <p class="field-hint">
                        Enter the total number of team members,
                        including the project owner.
                    </p>

                </div>

                <!-- Actions -->
                <div class="form-actions">

                    <a class="button button-secondary"
                       th:href="@{/projects}">
                        Cancel
                    </a>

                    <button class="button button-primary"
                            type="submit">
                        Create Project
                    </button>

                </div>

            </form>

        </section>

    </div>

</main>

</body>
</html>
