
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project | SkillForge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #f7f8fc;
        }
        form {
            background: white;
            border: 1px solid #e2e5ee;
            border-radius: 10px;
            padding: 24px;
        }
        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }
        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd0dc;
            border-radius: 6px;
            font: inherit;
        }
        textarea {
            min-height: 110px;
            resize: vertical;
        }
        button {
            margin-top: 22px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #3157d5;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        .back {
            color: #3157d5;
            text-decoration: none;
        }
        .error {
            padding: 12px;
            background: #fdecec;
            border-radius: 6px;
        }
        .hint {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a class="back" th:href="@{/projects}">&larr; Back to My Projects</a>

    <h1>Create a Project</h1>
    <p>Enter the details for your new SkillForge project.</p>

    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <form th:action="@{/projects}" method="post">
        <label for="name">Project name *</label>
        <input id="name"
               type="text"
               name="name"
               maxlength="150"
               required>

        <label for="description">Description</label>
        <textarea id="description"
                  name="description"
                  maxlength="5000"
                  placeholder="Describe your project and its goals"></textarea>

        <label for="requiredSkillsText">Required skills</label>
        <textarea id="requiredSkillsText"
                  name="requiredSkillsText"
                  maxlength="2000"
                  placeholder="For example: Java, SQL, HTML, CSS"></textarea>

        <label for="maxTeamSize">Maximum team size *</label>
        <input id="maxTeamSize"
               type="number"
               name="maxTeamSize"
               min="1"
               step="1"
               required>
        <p class="hint">Enter the total number of team members, including the project owner.</p>

        <button type="submit">Create Project</button>
    </form>
</body>
</html>
