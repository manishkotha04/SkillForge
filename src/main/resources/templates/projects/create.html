<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project | SkillForge</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/projects.css}">
</head>

<body class="dashboard-page">

<header th:replace="~{fragments/nav :: mainHeader('projects')}"></header>

<main class="dashboard-container">

    <a class="pj-back"
       th:href="@{/projects}">
        &larr; Back to projects
    </a>

    <div class="pj-header">

        <div>
            <p class="pj-eyebrow">New project</p>

            <h1>Create a project</h1>

            <p class="pj-subtitle">
                Enter the details for your new SkillForge project.
            </p>
        </div>

    </div>

    <!-- Server-side error -->
    <div class="message-stack"
         th:if="${errorMessage}">

        <div class="alert alert-error"
             role="alert">
            <span class="alert-icon">!</span>
            <span th:text="${errorMessage}">
                An error occurred.
            </span>
        </div>

    </div>

    <section class="pj-form-card">

        <form class="form-stack pj-form"
              th:action="@{/projects}"
              method="post">

            <h2 class="pj-section-title">Project details</h2>

            <!-- Project name -->
            <div class="form-field">

                <label for="name">
                    Project name<span class="pj-required" aria-hidden="true">*</span>
                </label>

                <input id="name"
                       type="text"
                       name="name"
                       maxlength="150"
                       required>

            </div>

            <!-- Description -->
            <div class="form-field">

                <label for="description">
                    Description<span class="pj-optional">Optional</span>
                </label>

                <textarea id="description"
                          name="description"
                          maxlength="5000"
                          rows="5"
                          placeholder="Describe your project and its goals"></textarea>

            </div>

            <h2 class="pj-section-title">Team requirements</h2>

            <!-- Required skills -->
            <div class="form-field">

                <label for="requiredSkillsText">
                    Required skills<span class="pj-optional">Optional</span>
                </label>

                <textarea id="requiredSkillsText"
                          name="requiredSkillsText"
                          maxlength="2000"
                          rows="4"
                          placeholder="For example: Java, SQL, HTML, CSS"></textarea>

            </div>

            <!-- Maximum team size -->
            <div class="form-field">

                <label for="maxTeamSize">
                    Maximum team size<span class="pj-required" aria-hidden="true">*</span>
                </label>

                <input id="maxTeamSize"
                       type="number"
                       name="maxTeamSize"
                       min="1"
                       step="1"
                       required>

                <p class="field-hint">
                    Enter the total number of team members,
                    including the project owner.
                </p>

            </div>

            <!-- Actions -->
            <div class="pj-actions">

                <button class="button button-primary"
                        type="submit">
                    Create Project
                </button>

                <a class="button button-secondary"
                   th:href="@{/projects}">
                    Cancel
                </a>

            </div>

        </form>

    </section>

</main>

</body>
</html>
