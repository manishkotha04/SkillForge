
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ownership Transfer Requests | SkillForge</title>

    <link rel="stylesheet"
          th:href="@{/css/ownership-transfers.css}">
</head>
<body>

<div class="transfer-container">

    <header class="page-header">
        <h1>Ownership Transfer Requests</h1>
        <p>Review project ownership requests sent to you.</p>
    </header>

    <p class="message success-message"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <p class="message error-message"
       th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <div class="empty-state" th:if="${#lists.isEmpty(transfers)}">
        <h2>No pending requests</h2>
        <p>You currently have no ownership transfer requests.</p>
    </div>

    <div th:each="transfer : ${transfers}" class="transfer-card">

        <span class="request-label">Pending request</span>

        <h2 th:text="${transfer.project.name}">Project Name</h2>

        <p>
            <strong>Requested by:</strong>
            <span th:text="${transfer.requestedBy.fullName}">Owner Name</span>
        </p>

        <p>
            You have been nominated to become the owner of this project.
        </p>

        <div class="transfer-actions">

            <form th:action="@{/ownership-transfers/{id}/accept(id=${transfer.id})}"
                  method="post">
                <button type="submit" class="accept-button">
                    Accept Request
                </button>
            </form>

            <form th:action="@{/ownership-transfers/{id}/reject(id=${transfer.id})}"
                  method="post">
                <button type="submit" class="reject-button">
                    Reject Request
                </button>
            </form>

        </div>
    </div>

    <a th:href="@{/projects}" class="back-link">
        ← Back to Projects
    </a>

</div>

</body>
</html>
