<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task | SkillForge</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header class="app-header">
    <div class="container site-nav">
        <a class="brand"
           th:href="@{/dashboard}">
            <span class="brand-mark">S</span>
            <span>SkillForge</span>
        </a>

        <nav class="nav-links">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/projects}">Projects</a>
            <a th:href="@{/profile}">Profile</a>
        </nav>
    </div>
</header>

<main class="page-main">
    <div class="container">

        <div style="margin-bottom: 28px;">
            <h1>Edit Task</h1>
            <p style="color: var(--muted);">
                Update the task details, assignee, or progress status.
            </p>
        </div>

        <form th:action="@{/tasks/{id}/edit(id=${taskId})}"
              th:object="${task}"
              method="post"
              class="form-stack">

            <div class="form-field">
                <label for="title">Task title</label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       maxlength="150"
                       required
                       th:attr="aria-invalid=${#fields.hasErrors('title')}">

                <p class="field-error"
                   th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}">
                </p>
            </div>

            <div class="form-field">
                <label for="description">Description</label>

                <textarea id="description"
                          th:field="*{description}"
                          rows="5"
                          style="width: 100%; padding: 12px 14px; color: var(--ink); background: white; border: 1px solid #dce2ed; border-radius: 11px; font: inherit; resize: vertical;">
                </textarea>
            </div>

            <div class="form-field">
                <label for="dueDate">Due date</label>

                <input id="dueDate"
                       type="date"
                       th:field="*{dueDate}">
            </div>

            <div class="form-field">
                <label for="assigneeId">Assign to</label>

                <select id="assigneeId"
                        th:field="*{assigneeId}"
                        style="width: 100%; min-height: 48px; padding: 12px 14px; color: var(--ink); background: white; border: 1px solid #dce2ed; border-radius: 11px; font: inherit;">

                    <option value="">Unassigned</option>

                    <option th:each="member : ${members}"
                            th:value="${member.id}"
                            th:text="${member.fullName}">
                    </option>

                </select>
            </div>

            <div class="form-field">
                <label for="status">Status</label>

                <select id="status"
                        th:field="*{status}"
                        style="width: 100%; min-height: 48px; padding: 12px 14px; color: var(--ink); background: white; border: 1px solid #dce2ed; border-radius: 11px; font: inherit;">

                    <option th:each="statusOption : ${T(com.skillforge.skillforge.enums.TaskStatus).values()}"
                            th:value="${statusOption}"
                            th:text="${statusOption}">
                    </option>

                </select>
            </div>

            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button type="submit"
                        class="button button-primary">
                    Save Changes
                </button>

                <a class="button button-secondary"
                   th:href="@{/tasks(projectId=${projectId})}">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</main>

</body>
</html>
