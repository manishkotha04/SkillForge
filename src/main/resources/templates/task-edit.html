<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task | SkillForge</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/components.css}">
</head>

<body>

<header class="app-header">
    <div class="container">
        <nav class="site-nav">

            <a class="brand"
               th:href="@{/dashboard}">
                <span class="brand-mark">S</span>
                <span>SkillForge</span>
            </a>

            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/projects}">Projects</a>
                <a th:href="@{/profile}">Profile</a>
            </div>

        </nav>
    </div>
</header>

<main class="page-main">

    <div class="container">

        <div class="page-header">

            <p class="field-hint">Project Tasks</p>

            <h1>Edit Task</h1>

            <p class="field-hint">
                Update the task details, assignee, or progress status.
            </p>

        </div>

        <section class="project-card">

            <form th:action="@{/tasks/{id}/edit(id=${taskId})}"
                  th:object="${task}"
                  method="post"
                  class="form-stack">

                <!-- Task title -->
                <div class="form-field">

                    <label for="title">
                        Task title
                    </label>

                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           maxlength="150"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('title')}">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}">
                    </p>

                </div>

                <!-- Description -->
                <div class="form-field">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description"
                              th:field="*{description}"
                              rows="5"
                              placeholder="Describe the task and expected outcome">
                    </textarea>

                </div>

                <!-- Due date -->
                <div class="form-field">

                    <label for="dueDate">
                        Due date
                    </label>

                    <input id="dueDate"
                           type="date"
                           th:field="*{dueDate}">

                </div>

                <!-- Assignee -->
                <div class="form-field">

                    <label for="assigneeId">
                        Assign to
                    </label>

                    <select id="assigneeId"
                            th:field="*{assigneeId}">

                        <option value="">
                            Unassigned
                        </option>

                        <option th:each="member : ${members}"
                                th:value="${member.id}"
                                th:text="${member.fullName}">
                        </option>

                    </select>

                </div>

                <!-- Status -->
                <div class="form-field">

                    <label for="status">
                        Status
                    </label>

                    <select id="status"
                            th:field="*{status}">

                        <option th:each="statusOption :
                                ${T(com.skillforge.skillforge.enums.TaskStatus).values()}"
                                th:value="${statusOption}"
                                th:text="${statusOption}">
                        </option>

                    </select>

                </div>

                <!-- Actions -->
                <div class="form-actions">

                    <button type="submit"
                            class="button button-primary">
                        Save Changes
                    </button>

                    <a class="button button-secondary"
                       th:href="@{/tasks(projectId=${projectId})}">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </div>

</main>

</body>
</html>
