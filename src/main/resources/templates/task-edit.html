<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Task | SkillForge</title>
<link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/projects.css}"><link rel="stylesheet" th:href="@{/css/tasks.css}">
<link rel="stylesheet" th:href="@{/css/tasks-fr09.css}">
</head>
<body class="dashboard-page">
<header th:replace="~{fragments/nav :: mainHeader('projects')}"></header>
<main class="dashboard-container">
<div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
<a class="pj-back" th:href="@{/tasks(projectId=${projectId})}">&larr; Back to tasks</a>
<div class="pj-header"><div><p class="pj-eyebrow">TASK DETAILS</p><h1>Edit task</h1><p class="pj-subtitle">Update task details, assignees or completion status.</p></div></div>
<section class="pj-form-card">
<form th:action="@{/tasks/{id}/edit(id=${taskId})}" th:object="${task}" method="post" class="form-stack pj-form">
<div class="alert alert-error" role="alert" th:if="${#fields.hasErrors('*')}">Please fix the highlighted fields.</div>
<div class="form-field"><label for="title">Task title *</label><input id="title" type="text" th:field="*{title}" maxlength="150" required><p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p></div>
<div class="form-field"><label for="description">Description</label><textarea id="description" th:field="*{description}" rows="5"></textarea></div>
<div class="form-field"><label for="dueDate">Due date</label><input id="dueDate" type="date" th:field="*{dueDate}"></div>
<div class="form-field"><label for="assigneeIds">Assign to one or more members</label><select id="assigneeIds" th:field="*{assigneeIds}" multiple size="5"><option th:each="member : ${members}" th:value="${member.id}" th:text="${member.fullName}">Member</option></select><p class="field-hint">Use Ctrl (Windows) or Command (Mac) to select multiple project members.</p></div>
<div class="form-field"><label for="status">Status</label><select id="status" th:field="*{status}"><option th:each="option : ${T(com.skillforge.skillforge.enums.TaskStatus).values()}" th:value="${option}" th:text="${option.name().replace('_',' ')}">TODO</option></select><p class="field-hint">Choose Done and save to record the completion date, time and completing user.</p></div>
<div class="pj-actions"><button type="submit" class="button button-primary">Save Changes</button><a class="button button-secondary" th:href="@{/tasks(projectId=${projectId})}">Cancel</a></div>
</form></section></main></body></html>
