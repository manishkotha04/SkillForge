<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="dashboard-header" th:fragment="mainHeader(active)">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">S</span><span>SkillForge</span>
    </a>
    <nav class="dashboard-nav" aria-label="Main navigation">
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        <a th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active'">Projects</a>
        <a th:href="@{/explore/projects}" th:classappend="${active == 'explore'} ? 'active'">Explore Projects</a>
        <a class="has-badge" th:with="pending=${@navigationInfo.pendingNotificationCount()}"
           th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? 'active'">
            Notifications
            <span class="nav-badge" th:if="${pending > 0}" th:text="${pending}" th:title="|${pending} pending notifications|">1</span>
        </a>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'">My profile</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="header-action">Sign out</button>
    </form>
</header>
</body>
</html>
