<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Tasks | SkillForge</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/components.css}">

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<header class="app-header">
    <div class="container">
        <nav class="site-nav">

            <a class="brand"
               th:href="@{/dashboard}">
                <span class="brand-mark">S</span>
                <span>SkillForge</span>
            </a>

            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/projects}">Projects</a>
                <a th:href="@{/profile}">Profile</a>
            </div>

        </nav>
    </div>
</header>

<main class="page-main">

    <div class="container">

        <!-- Page heading -->
        <div class="dashboard-header">

            <div>
                <p class="field-hint">Project</p>

                <h1>Project Tasks</h1>

                <p class="field-hint">
                    Manage tasks and track project progress.
                </p>
            </div>

            <a class="button button-primary"
               th:href="@{/tasks/new(projectId=${projectId})}">
                Create Task
            </a>

        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(tasks)}">

            <div class="project-card">

                <h3>No tasks yet</h3>

                <p>
                    Create the first task for this project.
                </p>

                <a class="button button-primary"
                   th:href="@{/tasks/new(projectId=${projectId})}">
                    Create Task
                </a>

            </div>

        </div>

        <!-- Task list -->
        <div class="project-grid"
             th:unless="${#lists.isEmpty(tasks)}">

            <article class="project-card"
                     th:each="task : ${tasks}">

                <div class="task-header">

                    <div>
                        <h3 th:text="${task.title}">
                            Task title
                        </h3>

                        <p th:if="${task.description != null
                                  and !#strings.isEmpty(task.description)}"
                           th:text="${task.description}">
                            Task description
                        </p>
                    </div>

                    <span class="project-category"
                          th:text="${task.status}">
                        TODO
                    </span>

                </div>

                <div class="form-stack">

                    <p>
                        <strong>Due date:</strong>

                        <span th:if="${task.dueDate != null}"
                              th:text="${task.dueDate}">
                            —
                        </span>

                        <span th:unless="${task.dueDate != null}">
                            No due date
                        </span>
                    </p>

                    <p>
                        <strong>Assigned to:</strong>

                        <span th:if="${task.assignee != null}"
                              th:text="${task.assignee.fullName}">
                            —
                        </span>

                        <span th:unless="${task.assignee == null}">
                            Unassigned
                        </span>
                    </p>

                </div>

                <!-- Task actions -->
                <div class="form-actions">

                    <a class="button button-secondary button-small"
                       th:href="@{/tasks/{id}/edit(id=${task.id})}">
                        Edit
                    </a>

                    <form th:action="@{/tasks/{id}/status(id=${task.id})}"
                          method="post"
                          class="form-actions">

                        <select name="status"
                                aria-label="Task status">

                            <option th:each="statusOption :
                                    ${T(com.skillforge.skillforge.enums.TaskStatus).values()}"
                                    th:value="${statusOption}"
                                    th:text="${statusOption}"
                                    th:selected="${statusOption == task.status}">
                                TODO
                            </option>

                        </select>

                        <button type="submit"
                                class="button button-primary button-small">
                            Update Status
                        </button>

                    </form>

                </div>

            </article>

        </div>

    </div>

</main>

</body>
</html>
