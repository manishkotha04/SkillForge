<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Portfolio Item | SkillForge</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/components.css}">
</head>

<body>

<header class="app-header">
    <div class="container">
        <nav class="site-nav">

            <a class="brand"
               th:href="@{/dashboard}">
                <span class="brand-mark">S</span>
                <span>SkillForge</span>
            </a>

            <div class="nav-links">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/projects}">Projects</a>
                <a th:href="@{/profile}">Profile</a>
            </div>

        </nav>
    </div>
</header>

<main class="page-main">

    <div class="container">

        <div class="page-header">

            <p class="field-hint">Your Work</p>

            <h1>Add Portfolio Item</h1>

            <p class="field-hint">
                Showcase a project, achievement, or piece of work.
            </p>

        </div>

        <section class="project-card">

            <form th:action="@{/portfolio}"
                  th:object="${item}"
                  method="post"
                  class="form-stack">

                <!-- Title -->
                <div class="form-field">

                    <label for="title">
                        Title
                    </label>

                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           maxlength="150"
                           required
                           th:attr="aria-invalid=${#fields.hasErrors('title')}">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}">
                    </p>

                </div>

                <!-- Description -->
                <div class="form-field">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description"
                              th:field="*{description}"
                              rows="6"
                              placeholder="Describe your work, contribution, or achievement.">
                    </textarea>

                </div>

                <!-- Project -->
                <div class="form-field">

                    <label for="projectId">
                        Project
                    </label>

                    <select id="projectId"
                            th:field="*{projectId}">

                        <option value="">
                            No project
                        </option>

                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.name}">
                        </option>

                    </select>

                    <p class="field-hint">
                        Optionally associate this portfolio item
                        with one of your projects.
                    </p>

                </div>

                <!-- External URL -->
                <div class="form-field">

                    <label for="externalUrl">
                        External link
                    </label>

                    <input id="externalUrl"
                           type="url"
                           th:field="*{externalUrl}"
                           maxlength="500"
                           placeholder="https://example.com">

                    <p class="field-hint">
                        Optional link to a repository, demo,
                        or other public work.
                    </p>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('externalUrl')}"
                       th:errors="*{externalUrl}">
                    </p>

                </div>

                <!-- Actions -->
                <div class="form-actions">

                    <button type="submit"
                            class="button button-primary">
                        Add to Portfolio
                    </button>

                    <a class="button button-secondary"
                       th:href="@{/portfolio}">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </div>

</main>

</body>
</html>
