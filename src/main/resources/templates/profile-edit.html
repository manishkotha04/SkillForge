<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - SkillForge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 9px 16px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 8px;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }

        .container {
            width: min(800px, 90%);
            margin: 45px auto;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #1d4ed8, #3730a3);
            color: white;
            padding: 35px 42px;
        }

        .form-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #dbeafe;
        }

        .form-body {
            padding: 40px 42px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-family: inherit;
            font-size: 15px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .hint {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        button,
        .cancel-button {
            padding: 11px 20px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            border: 1px solid #cbd5e1;
            color: #475569;
            background: white;
        }

        .cancel-button:hover {
            background: #f8fafc;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 5%;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .form-header,
            .form-body {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="brand">SkillForge</div>

    <a class="nav-link" th:href="@{/profile}">
        My Profile
    </a>
</nav>

<main class="container">

    <div class="form-card">

        <header class="form-header">
            <h1>Edit Profile</h1>
            <p>Keep your SkillForge profile up to date.</p>
        </header>

        <form class="form-body"
              th:action="@{/profile/edit}"
              th:object="${profile}"
              method="post">

            <div class="form-group">
                <label for="displayName">Display Name</label>

                <input
                    type="text"
                    id="displayName"
                    th:field="*{displayName}"
                    placeholder="Enter your display name"
                    required>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>

                <textarea
                    id="bio"
                    th:field="*{bio}"
                    placeholder="Tell other students about yourself"></textarea>

                <p class="hint">
                    A short introduction helps other students know you better.
                </p>
            </div>

            <div class="form-group">
                <label for="interests">Interests</label>

                <textarea
                    id="interests"
                    th:field="*{interests}"
                    placeholder="Describe your interests"></textarea>

                <p class="hint">
                    Mention areas you enjoy learning or working on.
                </p>
            </div>

            <div class="actions">
                <button type="submit">
                    Save Changes
                </button>

                <a class="cancel-button"
                   th:href="@{/profile}">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</main>

</body>
</html>
